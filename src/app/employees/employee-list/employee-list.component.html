<div class="container-fluid py-4">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0">Employees</h4>
      <p class="text-muted mb-0">Manage employee information</p>
    </div>
    <button class="btn btn-primary">
      + Add Employee
    </button>
  </div>

  <!-- Search Bar -->
  <div class="row mb-3">
    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Search employee..."
      />
    </div>
  </div>

  <!-- Employee Table -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>

            @for(emp of employees; track $index) {
                <tr>
                  <td>{{ $index + 1 }}</td>
                  <td>{{ emp.name }}</td>
                  <td>{{ emp.email }}</td>
                  <td>{{ emp.role }}</td>
                  <td>
                    <span
                      class="badge"
                      [class]="emp.status === 'Active' ? 'bg-success' : 'bg-secondary'"
                    >
                      {{ emp.status }}
                    </span>
                  </td>
                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary me-2">
                      Edit
                    </button>
                    <button class="btn btn-sm btn-outline-danger">
                      Delete
                    </button>
                  </td>
                </tr>
            }

            @if(!employees.length) {
                <tr>
                  <td colspan="6" class="text-center text-muted py-4">
                    No employees found
                  </td>
                </tr>
            }

          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
